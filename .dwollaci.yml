stages:
  build:
    nodeLabel: sbt
    steps:
      - sbt test Universal/packageBin
    filesToStash:
      - '**'
  deployDevInt:
    nodeLabel: nvm-sbt-deployer
    steps:
      - |
        . ${NVM_DIR}/nvm.sh --no-use
        nvm install
        npm install -g npm@9 && npm install -g serverless@3.40.0
        sbt "deploy DevInt"
  deployUat:
    nodeLabel: nvm-sbt-deployer
    steps:
      - |
        . ${NVM_DIR}/nvm.sh --no-use
        nvm install
        npm install -g npm@9 && npm install -g serverless@3.40.0
        sbt "deploy Uat"
  deployProd:
    nodeLabel: nvm-sbt-deployer
    steps:
      - |
        . ${NVM_DIR}/nvm.sh --no-use
        nvm install
        npm install -g npm@9 && npm install -g serverless@3.40.0
        sbt "deploy Prod"
